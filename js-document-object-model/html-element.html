<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Html Element</title>
    <!-- html itu adalah penyusun utama dari web. jadi ada element html yang memang memiliki property di dalam nya tanpa harus set attribute contoh a-->
</head>
<body>
    <!-- disini saya membuat element anchor tanpa attribute bawaannya yaitu href -->
    <a id="link">Yt</a>

    <script>

        const link = document.getElementById("link");
        // disini saya memanggil anchor nya menggunakan id nya dan .href tanpa set attribute nya
        link.href = "https://www.youtube.com";
        // bisa di lihat element dari anchor nya bisa menuju ke halam web nya

    </script>
</body>
</html>
