    <h1>Ya begitu</h1>

        const nodes = document.body.childNodes;
        // disini menggunakan body karena ingin melihat seluruh isi body dan childnodes untuk melihat semua turunan nodelist
        for (let node of nodes){
            //disini juga menggukan for o atau bisa juga for each untuk memanggil semua nodelist nya 
            console.log(`${node} : ${node.nodeType}`);

        };
    </script>
