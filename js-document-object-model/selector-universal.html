<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector Universal</title>
    <!-- ini merupakan salah satu contoh untuk penggunaan Selector Universal -->
</head>
<body>
    <p> ini paragraf</p>


    <script>

        const elements = document.querySelectorAll("*");
        // dia menggunakan querySelectorAll yang ber value * atau biasa di sebut semua 
        console.info(elements);
        // bisa di lihat di console dia men select semua element yang ada di html 
    </script>
</body>
</html>
